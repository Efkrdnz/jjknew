org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Simple Voice Chat. The API artifact is what we compile against; the full mod is
# pulled in only for the dev runtime. Never shaded -- players install it themselves
# (or let the CurseForge app resolve it from the declared required dependency).
voicechat_api_version=2.6.20
voicechat_version=1.21.1-2.6.22

# The host mod this addon drives. Compiled against, never bundled.
jjk_version=1.0.0
jjk_project_dir=../..

# The host mod's own required dependency, needed for the dev client to start.
geckolib_version=4.9.2

mod_id=jjkvoice
mod_name=JJK Strongest: Voice Commands
mod_license=Academic Free License v3.0
mod_version=0.1.0
mod_group_id=net.efkrdnz.jjkvoice
